<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
        <title>myDay</title>
        <script>
            /* Theme first, before anything paints — native Android tells us the real
               system theme; in a normal browser we follow prefers-color-scheme. */
            (function () {
                var dark;
                try {
                    dark =
                        window.Android && Android.isDark
                            ? Android.isDark()
                            : matchMedia("(prefers-color-scheme: dark)").matches;
                } catch (e) {
                    dark = true;
                }
                document.documentElement.setAttribute(
                    "data-theme",
                    dark ? "dark" : "light",
                );
            })();
        </script>
        <style>
@font-face{font-family:Nunito;font-weight:200 1000;font-style:normal;font-display:block;src:url(data:font/woff2;base64,{{FONT_B64}}) format("woff2")}

:root{
  --m-k:url("data:image/png;base64,{{MARK_K}}");
  --m-g:url("data:image/png;base64,{{MARK_G}}");
  --w-k:url("data:image/png;base64,{{WORD_K}}");
  --w-g:url("data:image/png;base64,{{WORD_G}}");
  --tab-h:66px;
}
/* Palette comes from the logo: ink + graphite on paper. One signal colour — red — means "recording". */
[data-theme=light]{
  --bg:#EDEDEB;--surf:#FFFFFF;--fill:#E3E3E0;--ink:#0B0B0B;--mute:#6A6A67;--line:#D8D8D4;
  --live:#E0381E;--on-live:#FFFFFF;--good:#1E7B45;
  --logo-k:#0B0B0B;--logo-g:#3C3C3C;
  --hero-mute:#A3A39F;--hero-line:#2E2E2E;--hero-live:#FF5C3F;--on-hero-live:#180500;
  color-scheme:light}
[data-theme=dark]{
  --bg:#0B0B0B;--surf:#151515;--fill:#222222;--ink:#F3F3F1;--mute:#8D8D8A;--line:#282828;
  --live:#FF5C3F;--on-live:#180500;--good:#4CD08A;
  --logo-k:#F3F3F1;--logo-g:#9B9B98;
  --hero-mute:#5F5F5C;--hero-line:#D4D4D0;--hero-live:#E0381E;--on-hero-live:#FFFFFF;
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{padding-bottom:calc(var(--tab-h) + 44px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button,.nosel{user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 0}

/* ---- logo (two alpha masks, recoloured per theme) ---- */
.mark,.word{position:relative;display:block;flex:none}
.mark{width:42px;height:42px}
.word{width:200px;height:51.5px}
.mark i,.word i{position:absolute;inset:0;display:block;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.mark .k{background:var(--logo-k);-webkit-mask-image:var(--m-k);mask-image:var(--m-k)}
.mark .g{background:var(--logo-g);-webkit-mask-image:var(--m-g);mask-image:var(--m-g)}
.word .k{background:var(--logo-k);-webkit-mask-image:var(--w-k);mask-image:var(--w-k)}
.word .g{background:var(--logo-g);-webkit-mask-image:var(--w-g);mask-image:var(--w-g)}

#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .mark{width:116px;height:116px}

/* ---- header ---- */
#hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hi{flex:1;min-width:0}
.hi h1{font-size:20.5px;font-weight:800;margin:0;letter-spacing:-.015em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .date{font-size:13.5px;color:var(--mute);font-weight:600}
.sync{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;min-width:34px;padding:0 13px;border-radius:999px;background:var(--surf);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);flex:none}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.sync.ok::before{background:var(--good)}
.sync.warn::before{background:var(--live)}
.sync.dotonly{padding:0}
.sync.dotonly span{display:none}

/* ---- shared ---- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.card.list{padding:2px 18px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.sec:first-child{margin-top:4px}
.sec h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.sec span{font-size:14px;color:var(--mute);font-weight:700}
.sec span b{color:var(--ink)}
.link{font-size:14px;font-weight:800;color:var(--ink);padding:8px 2px;display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;margin-right:7px}
.btn{width:100%;height:56px;border-radius:18px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:-.005em}
.btn svg{width:20px;height:20px}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--fill)}
.btn.red{background:var(--live);color:var(--on-live)}
.btn.line{border:1.5px solid var(--line)}
.btn.sm{height:50px;font-size:16px}
.pill{height:40px;padding:0 16px;border-radius:999px;font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none}
.pill svg{width:15px;height:15px}
.pill.start{background:var(--ink);color:var(--bg)}
.pill.stop{background:var(--live);color:var(--on-live)}
.pill.line{border:1.5px solid var(--line)}
.pill.okp{background:var(--fill);color:var(--ink)}
.pill.okp svg{color:var(--good)}
.empty{color:var(--mute);padding:16px 2px;font-weight:600}
.bar{height:6px;background:var(--fill);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}

/* ---- timer hero ---- */
.timer{--t-ink:var(--ink);--t-mute:var(--mute);--t-line:var(--line);--t-live:var(--live);--t-on-live:var(--on-live);
  background:var(--surf);border:1px solid var(--line);border-radius:30px;padding:22px 20px 18px;margin-bottom:14px;text-align:center;color:var(--t-ink);transition:background-color .4s ease,border-color .4s ease,color .4s ease}
.timer.on{background:var(--ink);border-color:var(--ink);--t-ink:var(--bg);--t-mute:var(--hero-mute);--t-line:var(--hero-line);--t-live:var(--hero-live);--t-on-live:var(--on-hero-live)}
.dial{display:block;width:208px;height:208px;margin:0 auto;overflow:visible}
.dial .trk{fill:none;stroke:var(--t-line);stroke-width:6}
.dial .arc{fill:none;stroke:var(--t-live);stroke-width:6;stroke-linecap:round}
.dial .tk{stroke:var(--t-ink);stroke-width:7;stroke-linecap:round}
.dial .mh{stroke:var(--t-ink);stroke-width:8;stroke-linecap:round}
.dial .sh{stroke:var(--t-live);stroke-width:3.5;stroke-linecap:round}
.dial .pv{fill:var(--t-ink)}
.dial .pc{fill:var(--t-live)}
.dial .g{transform-origin:100px 100px;transition:transform 1s linear}
.dial.idle .sh,.dial.idle .pc{opacity:0}
.digits{font-size:58px;font-weight:800;line-height:1;letter-spacing:-.025em;margin-top:8px;font-variant-numeric:tabular-nums}
.timer:not(.on) .digits{color:var(--t-mute)}
.what{margin-top:12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;min-width:0}
.what span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.what .dot{background:var(--t-live)}
.since{font-size:13.5px;color:var(--t-mute);font-weight:600;margin-top:2px}
.timer .btn{margin-top:18px}
.timer .btn.start{background:var(--ink);color:var(--bg)}
.timer .btn.stop{background:var(--t-live);color:var(--t-on-live)}
.aux{display:flex;justify-content:center;gap:6px;margin-top:6px}
.aux button{padding:10px 14px;font-size:14px;font-weight:700;color:var(--t-mute);border-radius:12px}
.foot{display:flex;justify-content:center;gap:8px;margin-top:10px;font-size:14px;font-weight:700;color:var(--t-mute)}
.foot b{color:var(--t-ink)}
.pick{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px 12px 16px;border-radius:18px;background:var(--fill);text-align:left}
.pick .pk{flex:1;min-width:0}
.pick .pk small{display:block;font-size:13px;color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pk b{display:block;font-weight:800;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick svg{width:18px;height:18px;color:var(--mute);flex:none}

/* ---- now block ---- */
.nrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.nrow>div{min-width:0}
.nt{font-size:13.5px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
.nn{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin-top:2px}
.now .bar{margin:14px 0 10px}
.nf{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--mute);font-weight:700}
.nf span:first-child{flex:none;white-space:nowrap}
.nf span:last-child{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---- tasks ---- */
.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .tx{flex:1;min-width:0;text-align:left;display:block}
.task .cl{display:flex;align-items:center;font-size:13px;font-weight:800;color:var(--mute);white-space:nowrap;overflow:hidden}
.task .cl .rec{width:7px;height:7px;border-radius:50%;background:var(--live);margin-left:8px;flex:none}
.task .ds{display:block;font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.task .meta{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.late{color:var(--live);font-weight:800}

/* ---- plan ---- */
.blk{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left;position:relative}
.blk:first-child{border-top:0}
.blk .t{width:96px;flex:none;font-size:13.5px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
.blk .n{flex:1;min-width:0;font-weight:700}
.blk.cur .n{font-weight:800}
.blk.cur .t{color:var(--ink)}
.blk.cur::before{content:"";position:absolute;left:-18px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ink)}
.blk.dn .n{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1.5px}
.blk.miss .n{color:var(--mute)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--bg)}
.ck svg{width:14px;height:14px}
.blk.dn .ck{background:var(--good);border-color:var(--good);color:#fff}
.dots{display:flex;gap:10px;margin:12px 0 2px}
.dots i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.dots i.h{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border-color:var(--ink)}
.dots-l{display:flex;gap:10px;font-size:11.5px;font-weight:700;color:var(--mute)}
.dots-l span{width:28px;text-align:center}

/* ---- timesheet ---- */
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.daynav button.arr{width:44px;height:44px;border-radius:14px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center}
.daynav button.arr:disabled{opacity:.3}
.daynav svg{width:20px;height:20px}
.daynav .dl{text-align:center}
.daynav .dl b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.daynav .dl span{font-size:13.5px;color:var(--mute);font-weight:600}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.total .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.total .sub{font-size:14px;color:var(--mute);font-weight:700}
.ent{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0}
.ent .et{flex:1;min-width:0}
.ent .et b{display:flex;align-items:center;font-size:13px;color:var(--mute);font-weight:800;white-space:nowrap;overflow:hidden}
.ent .et i{display:block;font-style:normal;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .er{text-align:right;flex:none}
.ent .er b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.ent .er i{display:block;font-style:normal;font-size:12.5px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
.ent.live .er b{color:var(--live)}
.ent .rec{width:7px;height:7px;border-radius:50%;background:var(--live);margin-left:8px;flex:none}
.days{display:flex;gap:8px;align-items:flex-end;height:104px;margin:4px 0 2px}
.days button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.days i{display:block;width:100%;border-radius:8px;background:var(--ink);min-height:4px}
.days b{font-size:12px;color:var(--mute);font-weight:800}
.days .z i{background:var(--fill)}
.days .sel b{color:var(--ink)}
.days .sel i{outline:2px solid var(--ink);outline-offset:2px}
.h3{font-size:15px;color:var(--ink);margin:20px 0 4px;font-weight:800}
.cr{margin:13px 0}
.cr .row{display:flex;justify-content:space-between;font-size:14.5px;font-weight:700;margin-bottom:6px;gap:10px}
.cr .row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .row span:last-child{color:var(--mute);font-variant-numeric:tabular-nums}

/* ---- tab bar & mini timer ---- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs>div{max-width:560px;margin:0 auto;display:flex;height:var(--tab-h)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);font-size:12px;font-weight:800}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:-1px;width:30px;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
#mini{position:fixed;left:14px;right:14px;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom));z-index:6;max-width:532px;margin:0 auto}
.mini{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:22px;padding:9px 9px 9px 18px}
.mini .mx{flex:1;min-width:0}
.mini .mc{font-size:13px;font-weight:700;color:var(--hero-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.mini .pill.stop{background:var(--hero-live);color:var(--on-hero-live);height:46px;padding:0 20px}

/* ---- toast & sheets ---- */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));z-index:30;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:13px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:15px}
#toast b{color:var(--hero-live);cursor:pointer;padding:6px 8px;font-weight:800}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:40;display:none;align-items:flex-end}
#sheet{width:100%;max-width:560px;margin:0 auto;background:var(--surf);border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .24s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
#sheet::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
#sheet h3{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.015em}
#sheet p{margin:0 0 6px;color:var(--mute);font-size:14.5px;font-weight:600}
#sheet label{display:block;font-size:13.5px;font-weight:800;color:var(--mute);margin:16px 0 7px}
#sheet input{width:100%;font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--fill);border:2px solid transparent;border-radius:15px;padding:14px 15px;outline:0;min-height:54px}
#sheet input:focus{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{padding:10px 15px;border-radius:999px;background:var(--fill);font-size:14.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips button.sel{background:var(--ink);color:var(--bg)}
.row2{display:flex;gap:10px;margin-top:20px}.row2 .btn{flex:1}
.row3{display:flex;gap:10px;margin:2px 0 6px}.row3 .btn{flex:1}
.cols{display:flex;gap:10px}.cols>div{flex:1;min-width:0}
.dur{margin-top:12px;font-size:14.5px;font-weight:800;color:var(--mute);text-align:center}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 2px;border-top:1px solid var(--line);text-align:left}
.opt:first-of-type{border-top:0}
.opt .ot{flex:1;min-width:0}
.opt .ot small{display:block;font-size:13px;font-weight:800;color:var(--mute)}
.opt .ot b{display:block;font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt svg{width:20px;height:20px;color:var(--good)}

@media (max-width:350px){.dial{width:176px;height:176px}.digits{font-size:50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
    </head>
    <body>
        <div id="splash"><img src="myDay-logo.svg" style="height: 240px" /></div>

        <div id="app">
            <header id="hd"></header>
            <section class="view" id="v-today">
                <div id="timer"></div>
                <section class="card now" id="now"></section>
                <div class="sec"><h2>Tasks</h2><button class="link" data-a="new" aria-label="New task"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New task</button></div>
                <section class="card list" id="work"></section>
            </section>
            <section class="view" id="v-plan" hidden>
                <div class="sec"><h2>Today’s plan</h2><span id="planCount"></span></div>
                <section class="card list" id="plan"></section>
                <div class="sec"><h2>Morning routine</h2><span id="streak"></span></div>
                <section class="card" id="routine"></section>
            </section>
            <section class="view" id="v-time" hidden>
                <div class="daynav" id="daynav"></div>
                <section class="card total" id="dayTotal"></section>
                <section class="card list" id="entries"></section>
                <button class="btn soft sm" data-a="addentry">Add time manually</button>
                <div class="sec"><h2>This week</h2><span id="weekTotal"></span></div>
                <section class="card" id="week"></section>
            </section>
        </div>

        <div id="mini"></div>
        <nav id="tabs"><div>
                <button class="tab on" data-a="tab" data-id="today" id="tab-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>Today</button>
                <button class="tab" data-a="tab" data-id="plan" id="tab-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.8 6.2l1.2 1.2 2-2.3M3.8 12.2l1.2 1.2 2-2.3M3.8 18.2l1.2 1.2 2-2.3"/></svg>Plan</button>

                /* ---------- helpers ---------- */
                const $ = function (s) {

                const esc = function (s) {

                        pad(d.getMonth() + 1) +

                        pad(d.getDate())

                };

                    return pad(d.getHours()) + ":" + pad(d.getMinutes());
                };
                const uid = function (p) {
                    return (
                        p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)

                };
                const r2 = function (n) {
                    return Math.round(n * 100) / 100;
                };
                function toMin(v) {
                    const m = String(v == null ? "" : v).match(/(\d{1,2}):(\d{2})/);
                    return m ? +m[1] * 60 + +m[2] : null;
                }
                function clock(m) {
                    return (Math.floor(m / 60) % 24) + ":" + pad(m % 60);
                }
                function fmtMin(m) {
                    m = +m || 0;
                    if (m <= 0) return "0m";
                    const s = Math.round(m * 60);
                    if (s < 60) return s + "s";
                    const t = Math.round(s / 60),
                        h = Math.floor(t / 60),
                        r = t % 60;

                }
                function hms(sec) {
                    sec = Math.max(0, Math.floor(sec));

                        Math.floor(sec / 3600) +
                        ":" +
                        pad(Math.floor((sec % 3600) / 60)) +

                        pad(sec % 60)

                }
                function isTrue(v) {
                    return v === true || String(v).toLowerCase() === "true";
                }
                function hue(s) {
                    let h = 0;
                    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
                    return h;
                }
                const tint = function (c) {

                };
                function daysBetween(a, b) {
                    return Math.round(
                        (new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 864e5,
                    );
                }
                function dayLabel(k) {
                    const t = dkey(new Date());
                    if (k === t) return "Today";

                    if (k === dkey(y)) return "Yesterday";

                }
                const $set = function (sel, txt) {

                /* ---------- state ---------- */
                function blank() {
                    return {
                        tasks: [],
                        log: [],
                        done: {},

                        queue: [],
                        schedule: null,
                        url: "",
                        rem: "",
                        sel: "",
                        known: {},

                    const j = JSON.parse(localStorage.getItem(KEY));

                    try {

                }
                const api = function () {
                    return CONFIG.SHEET_URL || S.url || "";
                };
                let syncState = "idle",
                    curDay = dkey(new Date()),
                    viewDay = curDay,
                    tab = "today",
                    sheetOpen = false,
                    undoFn = null,
                    toastT = 0;

                function normTask(t) {
                    return {
                        id: String(t.id),
                        clientId: String(t.clientId || ""),
                        description: String(t.description || ""),
                        startDate: String(t.startDate || "").slice(0, 10),
                        endDate: String(t.endDate || "").slice(0, 10),
                        status: String(t.status || "in-progress"),
                        totalMinutes: +t.totalMinutes || 0,
                    };
                }
                function normLog(e) {
                    return {
                        id: String(e.id),
                        date: String(e.date || "").slice(0, 10),
                        taskId: String(e.taskId || ""),
                        clientId: String(e.clientId || ""),
                        minutes: +e.minutes || 0,
                        startTime: String(e.startTime || ""),
                        endTime: String(e.endTime || ""),
                    };
                }
                function blocks() {
                    const rows =
                        S.schedule && S.schedule.length ? S.schedule : DEFAULT_SCHEDULE;
                    return rows
                        .map(function (r) {
                            let s = toMin(r.startTime),
                                e = toMin(r.endTime);
                            if (s != null && e != null && e <= s) e += 1440;
                            return {
                                id: String(r.id),
                                s: s,
                                e: e,
                                title: String(r.title || ""),
                            };
                        })
                        .filter(function (b) {
                            return b.s != null && b.e != null;
                        })
                        .sort(function (a, b) {
                            return a.s - b.s;
                        });
                }
                const taskById = function (id) {
                    return S.tasks.find(function (t) {
                        return t.id === id;
                    });
                };
                const isDone = function (id, d) {
                    return !!(S.done[d || dkey(new Date())] || {})[id];
                };
                function minutesOn(date, taskId) {
                    let n = 0;
                    S.log.forEach(function (e) {
                        if (e.date === date && (!taskId || e.taskId === taskId))
                            n += e.minutes;
                    });
                    return n;
                }
                const runMin = function () {
                    return S.timer ? Math.max(0, (Date.now() - S.timer.start) / 60000) : 0;
                };
                /* Minutes of the running timer that fall inside a given calendar day (a timer can span midnight). */
                function runningOn(day, taskId) {
                    if (!S.timer || (taskId && S.timer.taskId !== taskId)) return 0;
                    const d0 = new Date(day + "T00:00:00"),
                        d1 = new Date(d0);
                    d1.setDate(d1.getDate() + 1);
                    const lo = Math.max(S.timer.start, d0.getTime()),
                        hi = Math.min(Date.now(), d1.getTime());
                    return hi > lo ? (hi - lo) / 60000 : 0;
                }
                function lastKey(id) {
                    let k = "";

                        if (e.taskId === id) {
                            const x = e.date + " " + (e.endTime || "00:00");
                            if (x > k) k = x;

                    return k;
                }
                function activeTasks() {
                    const list = S.tasks.filter(function (t) {
                        return t.status !== "done";
                    });
                    list.sort(function (a, b) {
                        const ra = S.timer && S.timer.taskId === a.id ? 1 : 0,
                            rb = S.timer && S.timer.taskId === b.id ? 1 : 0;
                        if (ra !== rb) return rb - ra;
                        const ka = lastKey(a.id),
                            kb = lastKey(b.id);
                        return ka < kb ? 1 : ka > kb ? -1 : 0;
                    });
                    return list;
                }
                function selTask() {
                    let t = taskById(S.sel);
                    if (!t || t.status === "done") t = activeTasks()[0];
                    return t || null;
                }

                /* ---------- sync (JSONP to Apps Script, offline queue) ---------- */
                function jsonp(action, payload, timeout) {
                    return new Promise(function (res, rej) {
                        const base = api();
                        if (!base) return rej(new Error("no-url"));
                        let u;
                        try {
                            u = new URL(base);
                        } catch (e) {
                            return rej(e);
                        }

                            "jp" +
                            Date.now().toString(36) +
                            Math.random().toString(36).slice(2, 6);

                        let fin = false,
                            to;
                        function clean() {
                            fin = true;
                            delete window[cb];

                            clearTimeout(to);
                        }
                        to = setTimeout(function () {
                            if (!fin) {
                                clean();

                            }

                            }

                                rej(new Error("network"));
                            }

                        u.searchParams.set("payload", JSON.stringify(payload || {}));
                        u.searchParams.set("callback", cb);
                        sc.src = u.toString();

                    });
                }
                function setSync(s) {
                    syncState = s;
                    renderHeader();
                }
                function enqueue(action, payload, key) {
                    if (key)
                        S.queue = S.queue.filter(function (q) {
                            return q.key !== key;

                    S.queue.push({
                        action: action,
                        payload: payload,
                        key: key,
                        ts: Date.now(),
                    });
                    save();
                    flush();
                }
                function markKnown(it) {
                    const p = it.payload || {};
                    if (!p.id) return;
                    if (it.action === "upsertTask") S.known["t:" + p.id] = 1;
                    else if (it.action === "logTime") S.known["l:" + p.id] = 1;
                    else if (it.action === "deleteTask") delete S.known["t:" + p.id];
                    else if (it.action === "deleteTime") delete S.known["l:" + p.id];

                let lastErr = "",
                    lastCounts = "";

                    if (flushing || !api()) return;

                            const it = S.queue[0];
                            const r = await jsonp(it.action, it.payload);
                            if (r && r.status === "ok") {
                                markKnown(it);
                                S.queue.shift();
                            } else {
                                it.tries = (it.tries || 0) + 1;
                                S.queue.shift();

                    } catch (e) {
                        lastErr = e.message || "network";
                        setSync("fail");
                    } finally {
                        flushing = false;
                    }
                }
                /* Merge, never replace: the sheet's rows win, but anything on this phone that the sheet has never seen is kept and sent up. */
                async function pull() {
                    if (!api() || S.queue.length) return;
                    setSync("busy");
                    try {
                        const r = await jsonp("getAll", {});
                        if (!r || r.status !== "ok")
                            throw new Error(
                                (r && r.message) || "unexpected reply from the script",
                            );
                        if (S.queue.length) {
                            setSync("ok");
                            return;
                        } // user changed something while we waited
                        try {
                            if (S.tasks.length || S.log.length)
                                localStorage.setItem(
                                    KEY + ":backup",
                                    JSON.stringify({
                                        ts: Date.now(),
                                        tasks: S.tasks,
                                        log: S.log,
                                    }),
                                );
                        } catch (e) {}
                        const push = [];
                        const srvT = (r.clientTasks || [])
                                .map(normTask)
                                .filter(function (t) {
                                    return t.id;
                                }),
                            seenT = {};
                        srvT.forEach(function (t) {
                            seenT[t.id] = 1;
                            S.known["t:" + t.id] = 1;
                        });
                        S.tasks.forEach(function (t) {
                            if (seenT[t.id]) return;
                            if (S.known["t:" + t.id]) return; // it was on the sheet before and is gone now: deleted elsewhere
                            srvT.push(t);
                            push.push(["upsertTask", t, "task:" + t.id]);
                        });
                        S.tasks = srvT;
                        let nLog = S.log.length;
                        if (r.timeLog) {
                            const srvL = r.timeLog.map(normLog).filter(function (e) {
                                    return e.id;
                                }),
                                seenL = {};
                            srvL.forEach(function (e) {
                                seenL[e.id] = 1;
                                S.known["l:" + e.id] = 1;
                            });
                            S.log.forEach(function (e) {
                                if (seenL[e.id]) return;
                                if (S.known["l:" + e.id]) return;
                                srvL.push(e);
                                push.push(["logTime", e, "time:" + e.id]);
                            });
                            S.log = srvL;
                            nLog = srvL.length;
                        }
