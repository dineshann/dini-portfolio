                        (r.timetable || []).forEach(function (x) {
                            if (isTrue(x.completed)) {
                                const d = String(x.date).slice(0, 10);
                                (done[d] = done[d] || {})[String(x.block)] = true;
                            }
                        });
                        Object.keys(S.done).forEach(function (d) {
                            Object.keys(S.done[d]).forEach(function (b) {
                                (done[d] = done[d] || {})[b] =
                                    done[d][b] || (S.done[d][b] ? true : false);
                            });
                        });
                        S.done = done;
                        if (r.schedule && r.schedule.length) S.schedule = r.schedule;
                        lastCounts =
                            S.tasks.length +
                            " tasks, " +
                            nLog +
                            " time entries" +
                            (r.timeLog ? "" : " (this script version has no TimeLog tab)");
                        save();
                        setSync("ok");
                        render();
                        push.forEach(function (p) {
                            enqueue(p[0], p[1], p[2]);
                        });
                    } catch (e) {
                        lastErr = e.message || "network";
                        setSync("fail");
                    }
                }
                async function syncNow() {
                    await flush();
                    await pull();
                }

                /* ---------- time logging ---------- */
                function mkEntry(t, date, st, et, minutes) {
                    return {
                        id: uid("t"),
                        date: date,
                        taskId: t ? t.id : "",
                        clientId: t ? t.clientId : "",
                        minutes: r2(minutes),
                        startTime: st || "",
                        endTime: et || "",
                    };
                }
                function logEntry(t, e) {
                    S.log.push(e);
                    if (t && !t._ghost) {
                        t.totalMinutes = r2(t.totalMinutes + e.minutes);
                        enqueue("upsertTask", t, "task:" + t.id);
                    }
                    enqueue("logTime", e, "time:" + e.id);
                    return e;
                }
                /* Saves [start, end] as one entry per calendar day, so a session that crosses midnight lands on both days. */
                function addSession(t, start, end) {
                    const out = [];
                    let a = new Date(start);
                    while (dkey(a) !== dkey(end)) {
                        const mid = new Date(
                            a.getFullYear(),
                            a.getMonth(),
                            a.getDate() + 1,
                        );
                        out.push(
                            logEntry(
                                t,
                                mkEntry(t, dkey(a), hhmm(a), "24:00", (mid - a) / 60000),
                            ),
                        );
                        a = mid;
                    }
                    if (end - a >= 500)
                        out.push(
                            logEntry(
                                t,
                                mkEntry(t, dkey(a), hhmm(a), hhmm(end), (end - a) / 60000),
                            ),
                        );
                    return out;
                }
                function removeEntry(e) {
                    S.log = S.log.filter(function (x) {
                        return x.id !== e.id;
                    });
                    const t = taskById(e.taskId);
                    if (t) {
                        t.totalMinutes = Math.max(0, r2(t.totalMinutes - e.minutes));
                        enqueue("upsertTask", t, "task:" + t.id);
                    }
                    enqueue("deleteTime", { id: e.id }, "time:" + e.id);
                }
                function restoreEntry(e) {
                    S.log.push(e);
                    const t = taskById(e.taskId);
                    if (t) {
                        t.totalMinutes = r2(t.totalMinutes + e.minutes);
                        enqueue("upsertTask", t, "task:" + t.id);
                    }
                    enqueue("logTime", e, "time:" + e.id);
                }

                /* ---------- timer ---------- */
                function startTimer(id, atMs) {
                    const t = taskById(id);
                    if (!t) return;
                    let saved = "";
                    if (S.timer) {
                        if (S.timer.taskId === id) return;
                        saved = stopTimer(true) || "";
                    }
                    S.timer = {
                        taskId: id,
                        clientId: t.clientId,
                        desc: t.description,
                        start: atMs || Date.now(),
                    };
                    S.sel = id;
                    save();
                    render();
                    if (saved) toast("Saved " + saved + " · now tracking " + t.clientId);
                }
                /* Stops the running timer. Returns a text like "20m" for what was saved, or '' if nothing was. */
                function stopTimer(silent, endMs) {
                    if (!S.timer) return "";
                    const tm = S.timer,
                        start = new Date(tm.start);
                    let end = new Date(endMs || Date.now());
                    if (end < start) end = new Date(start);
                    const secs = (end - start) / 1000;
                    S.timer = null;
                    let entries = [];
                    if (secs >= CONFIG.MIN_SESSION_SEC) {
                        const t = taskById(tm.taskId) || {
                            id: tm.taskId,
                            clientId: tm.clientId,
                            totalMinutes: 0,
                            _ghost: true,
                        };
                        entries = addSession(t, start, end);
                    }
                    const txt = entries.length ? fmtMin(secs / 60) : "";
                    save();
                    render();
                    if (!silent) {
                        if (entries.length)
                            toast("Saved " + txt, "Undo", function () {
                                entries.forEach(removeEntry);
                                save();
                                render();
                            });
                        else
                            toast(
                                "Under " + CONFIG.MIN_SESSION_SEC + " seconds — not saved",
                            );
                    }
                    return txt;
                }
                function requestStop() {
                    if (!S.timer) return;
                    if (runMin() >= CONFIG.LONG_RUN_MIN) stopSheet();
                    else stopTimer(false);
                }
                function discardTimer() {
                    if (!S.timer) return;
                    const tm = S.timer;
                    S.timer = null;
                    save();
                    render();
                    toast("Timer discarded", "Undo", function () {
                        if (!S.timer) {
                            S.timer = tm;
                            save();
                            render();
                        }
                    });
                }
                /* Time the user tapped Stop on the Android notification (0 if none). */
                function checkNativeStop() {
                    if (!window.Android || !Android.pendingStop) return;
                    let ts = 0;
                    try {
                        ts = +Android.pendingStop() || 0;
                    } catch (e) {}
                    if (ts > 0 && S.timer) stopTimer(false, ts);
                }
                window.__nativeStop = checkNativeStop;
                let notifKey = null;
                function syncTimerNotif() {
                    if (!window.Android || !Android.showTimer) return;
                    const k = S.timer
                        ? S.timer.taskId + ":" + S.timer.start + ":" + S.timer.desc
                        : "";
                    if (k === notifKey) return;
                    notifKey = k;
                    try {
                        if (S.timer)
                            Android.showTimer(
                                S.timer.clientId,
                                S.timer.desc || "",
                                S.timer.start,
                            );
                        else Android.clearTimer();
                    } catch (e) {}
                }

                /* ---------- other actions ---------- */
                function toggleBlock(id) {
                    const d = dkey(new Date());
                    S.done[d] = S.done[d] || {};
                    const v = !S.done[d][id];
                    if (v) S.done[d][id] = true;
                    else delete S.done[d][id];
                    save();
                    enqueue(
                        "toggleBlock",
                        { date: d, block: id, completed: v },
                        "block:" + d + ":" + id,
                    );
                    render();
                }
                function setStatus(t, status) {
                    t.status = status;
                    save();
                    enqueue("upsertTask", t, "task:" + t.id);
                }
                function markDone(id) {
                    const t = taskById(id);
                    if (!t) return;
                    if (S.timer && S.timer.taskId === id) stopTimer(true);
                    setStatus(t, "done");
                    render();
                    toast("Task marked done", "Undo", function () {
                        setStatus(t, "in-progress");
                        render();
                    });
                }
                function createTask(client, desc, start) {
                    const t = {
                        id: uid("m"),
                        clientId: client,
                        description: desc,
                        startDate: dkey(new Date()),
                        endDate: "",
                        status: "in-progress",
                        totalMinutes: 0,
                    };
                    S.tasks.push(t);
                    S.sel = t.id;
                    save();
                    enqueue("upsertTask", t, "task:" + t.id);
                    if (start) startTimer(t.id);
                    else render();
                }

                /* ---------- ui: toast, sheets, tabs ---------- */
                function toast(msg, label, fn) {
                    const el = $("#toast");
                    undoFn = fn || null;
                    el.innerHTML =
                        "<span>" +
                        esc(msg) +
                        "</span>" +
                        (fn ? '<b data-a="undo">' + esc(label) + "</b>" : "");
                    el.style.display = "flex";
                    clearTimeout(toastT);
                    toastT = setTimeout(function () {
                        el.style.display = "none";
                        undoFn = null;
                    }, 6000);
                }
                function openSheet(html) {
                    $("#sheet").innerHTML = html;
                    $("#ov").style.display = "flex";
                    $("#sheet").scrollTop = 0;
                    sheetOpen = true;
                }
                function closeSheet() {
                    $("#ov").style.display = "none";
                    sheetOpen = false;
                }
                function setTab(t) {
                    tab = t;
                    closeSheet();
                    ["today", "plan", "time"].forEach(function (k) {
                        $("#v-" + k).hidden = k !== t;
                        $("#tab-" + k).classList.toggle("on", k === t);
                    });
                    if (t === "time") viewDay = dkey(new Date());
                    window.scrollTo(0, 0);
                    render();
                }
                window.__back = function () {
                    if (sheetOpen) {
                        closeSheet();
                        return true;
                    }
                    if (tab !== "today") {
                        setTab("today");
                        return true;
                    }
                    return false;
                };
                window.onNativeTheme = function (dark) {
                    document.documentElement.setAttribute(
                        "data-theme",
                        dark ? "dark" : "light",
                    );
                };
                try {
                    matchMedia("(prefers-color-scheme: dark)").addEventListener(
                        "change",
                        function (e) {
                            if (!window.Android) window.onNativeTheme(e.matches);
                        },
                    );
                } catch (e) {}

                function clientsByRecent() {
                    const seen = {},
                        out = [];
                    S.log
                        .slice()
                        .reverse()
                        .forEach(function (e) {
                            if (e.clientId && !seen[e.clientId]) {
                                seen[e.clientId] = 1;
                                out.push(e.clientId);
                            }
                        });
                    S.tasks.forEach(function (t) {
                        if (t.clientId && !seen[t.clientId]) {
                            seen[t.clientId] = 1;
                            out.push(t.clientId);
                        }
                    });
                    return out;
                }
                function newTaskSheet() {
                    const cl = clientsByRecent().slice(0, 8);
                    openSheet(
                        "<h3>New task</h3><p>Pick a client, add a note, then start the timer.</p>" +
                            "<label>Client</label>" +
                            (cl.length
                                ? '<div class="chips">' +
                                  cl
                                      .map(function (c) {
                                          return (
                                              '<button data-a="chip" data-c="' +
                                              esc(c) +
                                              '">' +
                                              esc(c) +
                                              "</button>"
                                          );
                                      })
                                      .join("") +
                                  "</div>"
                                : "") +
                            '<input id="fClient" placeholder="Client or project" autocapitalize="sentences">' +
                            "<label>What are you doing? (optional)</label>" +
                            '<input id="fDesc" placeholder="e.g. Inner pages" autocapitalize="sentences" enterkeyhint="go">' +
                            '<div class="row2"><button class="btn soft" data-a="create" data-s="0">Add task</button><button class="btn ink" data-a="create" data-s="1">' +
                            I.play +
                            "Start</button></div>",
                    );
                    if (cl[0]) {
                        $("#fClient").value = cl[0];
                        const b = document.querySelector(".chips button");
                        if (b) b.classList.add("sel");
                    }
                    setTimeout(function () {
                        const f = $(cl[0] ? "#fDesc" : "#fClient");
                        if (f) f.focus();
                    }, 80);
                }
                function pickSheet() {
                    const list = activeTasks(),
                        cur = selTask();
                    openSheet(
                        '<h3>Choose a task</h3><p>This is what Start will track.</p><div style="margin-top:8px">' +
                            list
                                .map(function (t) {
                                    return (
                                        '<button class="opt" data-a="setsel" data-id="' +
                                        esc(t.id) +
                                        '"><span class="dot" style="background:' +
                                        tint(t.clientId) +
                                        ';margin:0"></span><span class="ot"><small>' +
                                        esc(t.clientId) +
                                        "</small><b>" +
                                        esc(t.description || "No note") +
                                        "</b></span>" +
                                        (cur && cur.id === t.id ? I.check : "") +
                                        "</button>"
                                    );
                                })
                                .join("") +
                            '</div><div class="row2"><button class="btn soft" data-a="new">' +
                            I.plus +
                            "New task</button></div>",
                    );
                }
                let delArm = false;
                function taskSheet(id) {
                    const t = taskById(id);
                    if (!t) return;
                    delArm = false;
                    openSheet(
                        "<h3>" +
                            esc(t.clientId) +
                            "</h3><p>" +
                            esc(t.description || "No note") +
                            " · " +
                            fmtMin(t.totalMinutes) +
                            " in total</p>" +
                            "<label>Forgot the timer? Add time that ended just now</label>" +
                            '<div class="row3"><button class="btn soft sm" data-a="add" data-id="' +
                            esc(id) +
                            '" data-m="15">15 min</button><button class="btn soft sm" data-a="add" data-id="' +
                            esc(id) +
                            '" data-m="30">30 min</button><button class="btn soft sm" data-a="add" data-id="' +
                            esc(id) +
                            '" data-m="60">1 hour</button></div>' +
                            '<div class="row2"><button class="btn soft" data-a="del" data-id="' +
                            esc(id) +
                            '" id="delBtn" style="color:var(--live)">Delete task</button><button class="btn ink" data-a="done" data-id="' +
                            esc(id) +
                            '">' +
                            I.check +
                            "Mark done</button></div>",
                    );
                }
                function urlSheet() {
                    openSheet(
                        '<h3>Connect your Google Sheet</h3><p>Paste the Apps Script web-app URL once (it ends in /exec).</p><label>Web app URL</label><input id="fUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="row2"><button class="btn ink" data-a="saveurl">Save and sync</button></div>',
                    );
                }
                function startSheet() {
                    if (!S.timer) return;
                    const st = new Date(S.timer.start);
                    openSheet(
                        "<h3>Adjust start time</h3><p>Forgot to press Start? Move the start back.</p>" +
                            '<label>Started</label><div class="chips">' +
                            [5, 10, 15, 30, 60]
                                .map(function (m) {
                                    return (
                                        '<button data-a="startago" data-m="' +
                                        m +
                                        '">' +
                                        (m === 60 ? "1 hour" : m + " min") +
                                        " ago</button>"
                                    );
                                })
                                .join("") +
                            "</div>" +
                            '<label>Or set the time</label><input type="time" id="fStart" value="' +
                            hhmm(st) +
                            '">' +
                            '<div class="row2"><button class="btn ink" data-a="startset">Save start time</button></div>',
                    );
                }
                function stopSheet() {
                    if (!S.timer) return;
                    const st = new Date(S.timer.start),
                        run = runMin();
                    openSheet(
                        "<h3>Still tracking?</h3><p>This timer has been running for " +
                            fmtMin(run) +
                            ", since " +
                            hhmm(st) +
                            ". If you forgot to stop it, set when you really finished.</p>" +
                            '<label>Finished at</label><input type="time" id="fEnd" value="' +
                            hhmm(new Date()) +
                            '">' +
                            '<div class="row2"><button class="btn soft" data-a="stopnow">Keep all ' +
                            esc(fmtMin(run)) +
                            '</button><button class="btn ink" data-a="stopat">Use this time</button></div>',
                    );
                }
                function parseTimeOn(dayDate, v) {
                    const m = toMin(v);
                    if (m == null) return null;
                    const d = new Date(dayDate);
                    d.setHours(Math.floor(m / 60), m % 60, 0, 0);
                    return d;
                }

                /* entry editor — edit an existing entry, or add one by hand */
                function entrySheet(id) {
                    const e = S.log.find(function (x) {
                        return x.id === id;
                    });
                    if (!e) return;
                    const t = taskById(e.taskId),
                        hasT = !!(toMin(e.startTime) != null && toMin(e.endTime) != null);
                    const inV = function (v) {
                        return v === "24:00" ? "23:59" : v;
                    };
                    openSheet(
                        "<h3>" +
                            esc(e.clientId || "Entry") +
                            "</h3><p>" +
                            esc((t && t.description) || "No note") +
                            " · " +
                            esc(dayFull(e.date)) +
                            "</p>" +
                            (hasT
                                ? '<div class="cols"><div><label>Start</label><input type="time" id="eStart" value="' +
                                  inV(e.startTime) +
                                  '"></div><div><label>End</label><input type="time" id="eEnd" value="' +
                                  inV(e.endTime) +
                                  '"></div></div><div class="dur" id="eDur">' +
                                  esc(fmtMin(e.minutes)) +
                                  "</div>"
                                : '<label>Minutes</label><input type="number" inputmode="decimal" min="1" step="1" id="eMin" value="' +
                                  Math.round(e.minutes) +
                                  '">') +
                            '<div class="row2"><button class="btn soft" data-a="edel" data-id="' +
                            esc(id) +
                            '" id="eDelBtn" style="color:var(--live)">Delete</button><button class="btn ink" data-a="esave" data-id="' +
                            esc(id) +
                            '">Save</button></div>',
                    );
                    delArm = false;
                }
                let addSel = "";
                function addEntrySheet() {
                    const list = activeTasks();
                    if (!list.length) {
                        toast("Add a task first");
                        return;
                    }
                    const cur = selTask();
                    addSel = cur ? cur.id : list[0].id;
                    const isToday = viewDay === dkey(new Date()),
                        now = new Date();
                    const endV = isToday ? hhmm(now) : "17:00",
                        st = isToday ? new Date(now - 30 * 60000) : null;
                    openSheet(
                        "<h3>Add time</h3><p>" +
                            esc(dayFull(viewDay)) +
                            '</p><label>Task</label><div class="chips" id="eTasks">' +
                            list
                                .slice(0, 10)
                                .map(function (t) {
                                    return (
                                        '<button data-a="etask" data-id="' +
                                        esc(t.id) +
                                        '"' +
                                        (t.id === addSel ? ' class="sel"' : "") +
                                        ">" +
                                        esc(
                                            t.clientId +
                                                (t.description
                                                    ? " · " + t.description
                                                    : ""),
                                        ) +
                                        "</button>"
                                    );
                                })
                                .join("") +
                            "</div>" +
                            '<div class="cols"><div><label>Start</label><input type="time" id="eStart" value="' +
                            (st && dkey(st) === viewDay ? hhmm(st) : "16:30") +
                            '"></div><div><label>End</label><input type="time" id="eEnd" value="' +
                            endV +
                            '"></div></div><div class="dur" id="eDur"></div>' +
                            '<div class="row2"><button class="btn ink" data-a="eadd">Add time</button></div>',
                    );
                    updDur();
                }
                function updDur() {
                    const s = $("#eStart"),
                        e = $("#eEnd"),
                        d = $("#eDur");
                    if (!s || !e || !d) return;
                    const m = toMin(e.value) - toMin(s.value);
                    d.textContent =
                        isNaN(m) || m <= 0 ? "End must be after start" : fmtMin(m);
                }
                document.addEventListener("input", function (ev) {
                    if (ev.target.id === "eStart" || ev.target.id === "eEnd") updDur();
                });

                document.addEventListener("click", function (ev) {
                    if (ev.target.id === "ov") {
                        closeSheet();
                        return;
                    }
                    const el = ev.target.closest("[data-a]");
                    if (!el) return;
                    const a = el.dataset.a,
                        id = el.dataset.id;
                    switch (a) {
                        case "tab":
                            setTab(id);
                            break;
                        case "toggle":
                            if (S.timer && S.timer.taskId === id) requestStop();
                            else startTimer(id);
                            break;
                        case "startsel": {
                            const t = selTask();
                            if (t) startTimer(t.id);
                            else newTaskSheet();
                            break;
                        }
                        case "stop":
                            requestStop();
                            break;
                        case "pick":
                            pickSheet();
                            break;
                        case "setsel":
                            S.sel = id;
                            save();
                            closeSheet();
                            render();
                            break;
                        case "stopnow":
                            closeSheet();
                            stopTimer(false);
                            break;
                        case "stopat": {
                            const v = $("#fEnd").value,
                                st = new Date(S.timer.start);
                            let end = parseTimeOn(new Date(), v);
                            if (!end) {
                                toast("Choose a time");
                                break;
                            }
                            if (end.getTime() > Date.now()) end.setDate(end.getDate() - 1);
                            if (end <= st) {
                                toast("Finish time must be after " + hhmm(st));
                                break;
                            }
                            closeSheet();
                            stopTimer(false, end.getTime());
                            break;
                        }
                        case "editstart":
                            startSheet();
                            break;
                        case "startago":
                            S.timer.start = Date.now() - +el.dataset.m * 60000;
                            save();
                            closeSheet();
                            render();
                            toast("Start moved to " + hhmm(new Date(S.timer.start)));
                            break;
                        case "startset": {
                            let st = parseTimeOn(new Date(), $("#fStart").value);
                            if (!st) {
                                toast("Choose a time");
                                break;
                            }
                            if (st.getTime() > Date.now()) st.setDate(st.getDate() - 1);
                            S.timer.start = st.getTime();
                            save();
                            closeSheet();
                            render();
                            toast("Start moved to " + hhmm(st));
                            break;
                        }
                        case "discard":
                            discardTimer();
                            break;
                        case "done":
                            closeSheet();
                            markDone(id);
                            break;
                        case "menu":
                            taskSheet(id);
                            break;
                        case "new":
                            newTaskSheet();
                            break;
                        case "block":
                            toggleBlock(id);
                            break;
                        case "undo": {
                            const f = undoFn;
                            undoFn = null;
                            $("#toast").style.display = "none";
                            if (f) f();
                            break;
                        }
                        case "chip":
                            $("#fClient").value = el.dataset.c;
                            document
                                .querySelectorAll(".chips button")
                                .forEach(function (b) {
                                    b.classList.toggle("sel", b === el);
                                });
                            {
                                const d = $("#fDesc");
                                if (d) d.focus();
                            }
                            break;
                        case "create": {
                            const c = $("#fClient").value.trim(),
                                d = $("#fDesc").value.trim();
                            if (!c) {
                                $("#fClient").focus();
                                break;
                            }
                            closeSheet();
                            createTask(c, d, el.dataset.s === "1");
                            break;
                        }
                        case "add": {
                            const t = taskById(id),
                                m = +el.dataset.m,
                                now = new Date();
                            closeSheet();
                            const es = addSession(t, new Date(now - m * 60000), now);
                            save();
                            render();
                            toast("Added " + fmtMin(m), "Undo", function () {
                                es.forEach(removeEntry);
                                save();
                                render();
                            });
                            break;
                        }
                        case "del": {
                            if (!delArm) {
                                delArm = true;
                                el.textContent = "Tap again to delete";
                                break;
                            }
                            if (S.timer && S.timer.taskId === id) stopTimer(true);
                            S.tasks = S.tasks.filter(function (x) {
                                return x.id !== id;
                            });
                            save();
                            enqueue("deleteTask", { id: id }, "task:" + id);
                            closeSheet();
                            render();
                            break;
                        }
                        case "sync":
                            if (!api()) urlSheet();
                            else {
                                toast("Syncing…");
                                syncNow().then(function () {
                                    toast(
                                        syncState === "fail"
                                            ? "Sync failed: " + lastErr
                                            : S.queue.length
                                              ? S.queue.length + " changes still waiting"
                                              : "Synced · " + lastCounts,
                                    );
                                });
                            }
                            break;
                        case "saveurl": {
                            const v = $("#fUrl").value.trim();
                            if (
                                !/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(v)
                            ) {
                                toast("That doesn’t look like an Apps Script URL");
                                break;
                            }
                            S.url = v;
                            save();
                            closeSheet();
                            toast("Connected — syncing…");
                            syncNow();
                            break;
                        }
                        case "dprev": {
                            const d = new Date(viewDay + "T00:00:00");
                            d.setDate(d.getDate() - 1);
                            viewDay = dkey(d);
                            render();
                            break;
                        }
                        case "dnext": {
                            const d = new Date(viewDay + "T00:00:00");
                            d.setDate(d.getDate() + 1);
                            if (dkey(d) <= dkey(new Date())) {
                                viewDay = dkey(d);
                                render();
                            }
                            break;
                        }
                        case "day":
                            viewDay = el.dataset.d;
                            render();
                            break;
                        case "entry":
                            entrySheet(id);
                            break;
                        case "addentry":
                            addEntrySheet();
                            break;
                        case "etask":
                            addSel = id;
                            document
                                .querySelectorAll("#eTasks button")
                                .forEach(function (b) {
                                    b.classList.toggle("sel", b === el);
                                });
                            break;
                        case "eadd": {
                            const t = taskById(addSel),
                                s = toMin($("#eStart").value),
                                e = toMin($("#eEnd").value);
                            if (!t || s == null || e == null || e <= s) {
                                toast("End must be after start");
                                break;
                            }
                            const day = new Date(viewDay + "T00:00:00"),
                                endD = parseTimeOn(day, $("#eEnd").value);
                            if (endD.getTime() > Date.now() + 60000) {
                                toast("That end time is in the future");
                                break;
                            }
                            const en = logEntry(
                                t,
                                mkEntry(
                                    t,
                                    viewDay,
                                    $("#eStart").value,
                                    $("#eEnd").value,
                                    e - s,
                                ),
                            );
                            closeSheet();
                            save();
                            render();
                            toast("Added " + fmtMin(e - s), "Undo", function () {
                                removeEntry(en);
                                save();
                                render();
                            });
                            break;
                        }
                        case "esave": {
                            const e = S.log.find(function (x) {
                                return x.id === id;
                            });
                            if (!e) {
                                closeSheet();
                                break;
                            }
                            let m,
                                st = e.startTime,
                                et = e.endTime;
                            if ($("#eStart")) {
                                const inV = function (v) {
                                    return v === "24:00" ? "23:59" : v;
                                };
                                const ns = $("#eStart").value,
                                    ne = $("#eEnd").value;
                                if (ns === inV(e.startTime) && ne === inV(e.endTime)) {
                                    closeSheet();
                                    break;
                                }
                                m = toMin(ne) - toMin(ns);
                                if (isNaN(m) || m <= 0) {
                                    toast("End must be after start");
                                    break;
                                }
                                st = ns;
                                et = ne;
                            } else {
                                m = +$("#eMin").value;
                                if (!(m > 0)) {
                                    toast("Enter the minutes");
                                    break;
                                }
                                if (Math.abs(m - e.minutes) < 0.5) {
                                    closeSheet();
                                    break;
                                }
                            }
                            const before = {
                                minutes: e.minutes,
                                startTime: e.startTime,
                                endTime: e.endTime,
                            };
                            const t = taskById(e.taskId);
                            if (t) {
                                t.totalMinutes = Math.max(
                                    0,
                                    r2(t.totalMinutes + m - e.minutes),
                                );
                                enqueue("upsertTask", t, "task:" + t.id);
                            }
                            e.minutes = r2(m);
                            e.startTime = st;
                            e.endTime = et;
                            enqueue("logTime", e, "time:" + e.id);
                            closeSheet();
                            save();
                            render();
                            toast("Entry updated", "Undo", function () {
                                const x = S.log.find(function (y) {
                                    return y.id === id;
                                });
                                if (!x) return;
                                const tk = taskById(x.taskId);
                                if (tk) {
                                    tk.totalMinutes = Math.max(
                                        0,
                                        r2(tk.totalMinutes + before.minutes - x.minutes),
                                    );
                                    enqueue("upsertTask", tk, "task:" + tk.id);
                                }
                                x.minutes = before.minutes;
                                x.startTime = before.startTime;
                                x.endTime = before.endTime;
                                enqueue("logTime", x, "time:" + x.id);
                                save();
                                render();
                            });
                            break;
                        }
                        case "edel": {
                            if (!delArm) {
                                delArm = true;
                                el.textContent = "Tap again to delete";
                                break;
                            }
                            const e = S.log.find(function (x) {
                                return x.id === id;
                            });
                            closeSheet();
                            if (!e) break;
                            removeEntry(e);
                            save();
                            render();
                            toast("Entry deleted", "Undo", function () {
                                restoreEntry(e);
                                save();
                                render();
                            });
                            break;
                        }
                    }
                });
                document.addEventListener("keydown", function (e) {
                    if (e.key === "Enter" && e.target.id === "fDesc") {
                        const b = document.querySelector('[data-a="create"][data-s="1"]');
                        if (b) b.click();
                    }
                });

                /* ---------- render ---------- */
                const LOGO =
                    '<span class="mark" role="img" aria-label="myDay"><img src="logo.svg" style="height: 40px" /></span>';
                function renderHeader() {
                    const d = new Date(),
                        h = d.getHours();
                    const greet =
                        h < 12
                            ? "Good morning"
                            : h < 17
                              ? "Good afternoon"
                              : "Good evening";
                    const n = S.queue.length;
                    let cls = "sync",
                        txt;
                    if (!api()) txt = "Not connected";
                    else if (n && syncState !== "busy") {
                        cls += " warn";
                        txt = n + " waiting";
                    } else if (syncState === "busy") {
                        cls += " dotonly";
                        txt = "Syncing";
                    } else if (syncState === "fail") {
                        cls += " warn";
                        txt = "Offline";
                    } else {
                        cls += " ok dotonly";
                        txt = "Synced";
                    }
                    $("#hd").innerHTML =
                        LOGO +
                        '<div class="hi"><h1>' +
                        greet +
                        ", " +
                        esc(CONFIG.NAME) +
                        '</h1><div class="date">' +
                        d.toLocaleDateString(undefined, {
                            weekday: "long",
                            day: "numeric",
                            month: "long",
                        }) +
                        '</div></div><button class="' +
                        cls +
                        '" data-a="sync" aria-label="' +
                        txt +
                        '. Tap to sync"><span>' +
                        txt +
                        "</span></button>";
                }
                function dialSVG(running, sec) {
                    const C = 2 * Math.PI * 84,
                        frac = running ? (sec % 3600) / 3600 : 0;
                    const secA = running ? (sec + 1) * 6 : 0,
                        minA = running ? ((sec + 1) / 3600) * 360 : 0;
                    return (
                        '<svg class="dial ' +
                        (running ? "" : "idle") +
                        '" viewBox="0 0 200 200" aria-hidden="true">' +
                        '<circle class="trk" cx="100" cy="100" r="84"/>' +
                        '<circle class="arc" id="dArc" cx="100" cy="100" r="84" stroke-dasharray="' +
                        C.toFixed(2) +
                        '" stroke-dashoffset="' +
                        (C * (1 - frac)).toFixed(2) +
                        '" transform="rotate(-90 100 100)"/>' +
                        '<line class="tk" x1="100" y1="29" x2="100" y2="38"/><line class="tk" x1="171" y1="100" x2="162" y2="100"/><line class="tk" x1="100" y1="171" x2="100" y2="162"/><line class="tk" x1="29" y1="100" x2="38" y2="100"/>' +
                        '<g class="g" id="dMin" style="transform:rotate(' +
                        minA.toFixed(2) +
                        'deg)"><line class="mh" x1="100" y1="100" x2="100" y2="58"/></g>' +
                        '<g class="g" id="dSec" style="transform:rotate(' +
                        secA.toFixed(2) +
                        'deg)"><line class="sh" x1="100" y1="112" x2="100" y2="46"/></g>' +
                        '<circle class="pv" cx="100" cy="100" r="9"/><circle class="pc" cx="100" cy="100" r="3.6"/></svg>'
                    );
                }
                function renderTimer() {
                    const today = dkey(new Date()),
                        tot =
                            '<div class="foot"><span>Today</span><b id="todayTotal">' +
                            fmtMin(minutesOn(today) + runningOn(today)) +
                            "</b></div>";
                    if (S.timer) {
                        const sec = (Date.now() - S.timer.start) / 1000,
                            st = new Date(S.timer.start);
                        $("#timer").innerHTML =
                            '<div class="timer on">' +
                            dialSVG(true, sec) +
                            '<div class="digits" id="dTime">' +
                            hms(sec) +
                            "</div>" +
                            '<div class="what"><i class="dot"></i><span>' +
                            esc(S.timer.clientId) +
                            (S.timer.desc ? " · " + esc(S.timer.desc) : "") +
                            "</span></div>" +
                            '<div class="since">Started ' +
                            hhmm(st) +
                            (dkey(st) !== today ? " yesterday" : "") +
                            "</div>" +
                            '<button class="btn stop" data-a="stop">' +
                            I.stop +
                            "Stop</button>" +
                            '<div class="aux"><button data-a="editstart">Adjust start</button><button data-a="discard">Discard</button></div>' +
                            tot +
                            "</div>";
                    } else {
                        const t = selTask();
                        $("#timer").innerHTML =
                            '<div class="timer">' +
                            dialSVG(false, 0) +
                            '<div class="digits">0:00:00</div>' +
                            (t
                                ? '<button class="pick" data-a="pick"><span class="pk"><small>' +
                                  esc(t.clientId) +
                                  "</small><b>" +
                                  esc(t.description || "No note") +
                                  "</b></span>" +
                                  I.chev +
                                  "</button>" +
                                  '<button class="btn start" data-a="startsel">' +
                                  I.play +
                                  "Start</button>"
                                : '<div class="what" style="color:var(--t-mute)"><span>Add a task to start tracking</span></div><button class="btn start" data-a="new">' +
                                  I.plus +
                                  "New task</button>") +
                            tot +
                            "</div>";
                    }
                }
                function renderNow() {
                    const bl = blocks(),
                        d = new Date(),
                        nm = d.getHours() * 60 + d.getMinutes();
                    const cur = bl.find(function (b) {
                            return nm >= b.s && nm < b.e;
                        }),
                        nxt = bl.find(function (b) {
                            return b.s > nm;
                        });
                    let h;
                    if (cur) {
                        const dn = isDone(cur.id),
                            pct = Math.round(((nm - cur.s) / (cur.e - cur.s)) * 100);
                        h =
                            '<div class="nrow"><div><div class="nt">Now · ' +
                            clock(cur.s) +
                            "–" +
                            clock(cur.e) +
                            '</div><div class="nn">' +
                            esc(cur.title) +
                            "</div></div>" +
                            '<button class="pill ' +
                            (dn ? "okp" : "line") +
                            '" data-a="block" data-id="' +
                            esc(cur.id) +
                            '" aria-label="' +
                            (dn ? "Undo done" : "Mark done") +
                            '">' +
                            (dn ? I.check + "Done" : "Mark done") +
                            "</button></div>" +
                            '<div class="bar"><i style="width:' +
                            pct +
                            '%"></i></div><div class="nf"><span>' +
                            fmtMin(cur.e - nm) +
                            " left</span>" +
                            (nxt
                                ? "<span>Next " +
                                  clock(nxt.s) +
                                  " · " +
                                  esc(nxt.title) +
                                  "</span>"
                                : "") +
                            "</div>";
                    } else if (nxt) {
                        h =
                            '<div class="nt">Next · in ' +
                            fmtMin(nxt.s - nm) +
                            '</div><div class="nn">' +
                            esc(nxt.title) +
                            '</div><div class="nf" style="margin-top:8px"><span>Starts at ' +
                            clock(nxt.s) +
                            "</span></div>";
                    } else
                        h =
                            '<div class="nt">Schedule</div><div class="nn">Day complete. Rest well.</div>';
                    $("#now").innerHTML = h;
                }
                function renderWork() {
                    const list = activeTasks(),
                        today = dkey(new Date());
                    $("#work").innerHTML = list.length
                        ? list
                              .map(function (t) {
                                  const run = S.timer && S.timer.taskId === t.id;
                                  let due = "";
                                  if (t.endDate) {
                                      const n = daysBetween(t.endDate, today);
                                      if (n < 0)
                                          due = ' · <span class="late">overdue</span>';
                                      else if (n <= 3)
                                          due =
                                              " · due " +
                                              (n === 0 ? "today" : "in " + n + "d");
                                  }
                                  return (
                                      '<div class="task"><button class="tx" data-a="menu" data-id="' +
                                      esc(t.id) +
                                      '"><span class="cl"><i class="dot" style="background:' +
                                      tint(t.clientId) +
                                      '"></i>' +
                                      esc(t.clientId) +
                                      (run ? '<i class="rec"></i>' : "") +
                                      "</span>" +
                                      '<span class="ds">' +
                                      esc(t.description || "No note") +
                                      '</span><span class="meta" data-meta="' +
                                      esc(t.id) +
                                      '">' +
                                      metaText(t, today) +
                                      due +
                                      "</span></button>" +
                                      '<button class="pill ' +
                                      (run ? "stop" : "start") +
                                      '" data-a="toggle" data-id="' +
                                      esc(t.id) +
                                      '">' +
                                      (run ? I.stop + "Stop" : I.play + "Start") +
                                      "</button></div>"
                                  );
                              })
                              .join("")
                        : '<div class="empty">No tasks yet. Add one and press Start.</div>';
                }
                function metaText(t, today) {
                    const run = S.timer && S.timer.taskId === t.id;
                    return (
                        "Today " +
                        fmtMin(minutesOn(today, t.id) + runningOn(today, t.id)) +
                        " · Total " +
                        fmtMin(t.totalMinutes + (run ? runMin() : 0))
                    );
                }
                function renderPlan() {
                    const bl = blocks(),
                        d = new Date(),
                        nm = d.getHours() * 60 + d.getMinutes();
                    const n = bl.filter(function (b) {
                        return isDone(b.id);
                    }).length;
                    $("#planCount").textContent = n + " of " + bl.length + " done";
                    $("#plan").innerHTML = bl
                        .map(function (b) {
                            const dn = isDone(b.id),
                                cur = nm >= b.s && nm < b.e,
                                miss = !dn && b.e <= nm;
                            return (
                                '<button class="blk ' +
                                (dn ? "dn " : "") +
                                (cur ? "cur " : "") +
                                (miss ? "miss" : "") +
                                '" data-a="block" data-id="' +
                                esc(b.id) +
                                '"><span class="t">' +
                                clock(b.s) +
                                "–" +
                                clock(b.e) +
                                '</span><span class="n">' +
                                esc(b.title) +
                                '</span><span class="ck">' +
                                (dn ? I.check : "") +
                                "</span></button>"
                            );
                        })
                        .join("");
                    const L = ["S", "M", "T", "W", "T", "F", "S"],
                        days = [];
                    for (let i = 6; i >= 0; i--) {
                        const x = new Date();
                        x.setDate(x.getDate() - i);
                        days.push({ k: dkey(x), l: L[x.getDay()] });
                    }
                    const rids = bl
                        .filter(function (b) {
                            return b.s < (toMin(CONFIG.ROUTINE_UNTIL) || 450);
                        })
                        .map(function (b) {
                            return b.id;
                        });
                    const rs = days.map(function (x) {
                        const c = rids.filter(function (id) {
                            return isDone(id, x.k);
                        }).length;
                        return rids.length ? c / rids.length : 0;
                    });
                    let streak = 0;
                    for (let i = rs.length - 1; i >= 0; i--) {
                        if (rs[i] >= 1) streak++;
                        else if (i === rs.length - 1) continue;
                        else break;
                    }
                    $("#streak").textContent = streak ? streak + "-day streak" : "";
                    $("#routine").innerHTML = rids.length
                        ? '<div class="dots">' +
                          rs
                              .map(function (r) {
                                  return (
                                      '<i class="' +
                                      (r >= 1 ? "f" : r > 0 ? "h" : "") +
                                      '"></i>'
                                  );
                              })
                              .join("") +
                          '</div><div class="dots-l">' +
                          days
                              .map(function (x) {
                                  return "<span>" + x.l + "</span>";
                              })
                              .join("") +
                          "</div>"
                        : '<div class="empty">No early blocks in your schedule.</div>';
                }
                function renderTime() {
                    const today = dkey(new Date()),
                        isT = viewDay === today;
                    $("#daynav").innerHTML =
                        '<button class="arr" data-a="dprev" aria-label="Previous day">' +
                        I.left +
                        '</button><div class="dl"><b>' +
                        dayLabel(viewDay) +
                        "</b><span>" +
                        dayFull(viewDay) +
                        '</span></div><button class="arr" data-a="dnext" aria-label="Next day"' +
                        (isT ? " disabled" : "") +
                        ">" +
                        I.right +
                        "</button>";
                    const es = S.log
                        .filter(function (e) {
                            return e.date === viewDay;
                        })
                        .sort(function (a, b) {
                            return (
                                (toMin(a.startTime) == null ? 1e4 : toMin(a.startTime)) -
                                (toMin(b.startTime) == null ? 1e4 : toMin(b.startTime))
                            );
                        });
                    const live = runningOn(viewDay),
                        tot = minutesOn(viewDay) + live,
                        cnt = es.length + (live > 0 ? 1 : 0);
                    $("#dayTotal").innerHTML =
                        '<div class="big" id="dayBig">' +
                        fmtMin(tot) +
                        '</div><div class="sub">' +
                        cnt +
                        (cnt === 1 ? " session" : " sessions") +
                        "</div>";
                    let rows = es
                        .map(function (e) {
                            const t = taskById(e.taskId),
                                tm =
                                    e.startTime && e.endTime
                                        ? e.startTime + "–" + e.endTime
                                        : "Added by hand";
                            return (
                                '<button class="ent" data-a="entry" data-id="' +
                                esc(e.id) +
                                '"><span class="et"><b><i class="dot" style="background:' +
                                tint(e.clientId) +
                                '"></i>' +
                                esc(e.clientId || "No client") +
                                "</b><i>" +
                                esc((t && t.description) || "No note") +
                                '</i></span><span class="er"><b>' +
                                fmtMin(e.minutes) +
                                "</b><i>" +
                                esc(tm) +
                                "</i></span></button>"
                            );
                        })
                        .join("");
                    if (live > 0)
                        rows +=
                            '<div class="ent live"><span class="et"><b><i class="dot" style="background:' +
                            tint(S.timer.clientId) +
                            '"></i>' +
                            esc(S.timer.clientId) +
                            '<i class="rec"></i></b><i>' +
                            esc(S.timer.desc || "No note") +
                            '</i></span><span class="er"><b id="liveDur">' +
                            fmtMin(live) +
                            "</b><i>Running</i></span></div>";
                    $("#entries").innerHTML =
                        rows ||
                        '<div class="empty">Nothing tracked ' +
                            (isT ? "yet today" : "on this day") +
                            ".</div>";

                    const days = [],
                        L = ["S", "M", "T", "W", "T", "F", "S"];
                    for (let i = 6; i >= 0; i--) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        days.push({ k: dkey(d), l: L[d.getDay()] });
                    }
                    days.forEach(function (x) {
                        x.m = minutesOn(x.k) + runningOn(x.k);
                    });
                    const max = Math.max.apply(
                            null,
                            days
                                .map(function (x) {
                                    return x.m;
                                })
                                .concat([60]),
                        ),
                        total = days.reduce(function (a, x) {
                            return a + x.m;
                        }, 0);
                    const per = {};
                    S.log.forEach(function (e) {
                        if (
                            days.some(function (x) {
                                return x.k === e.date;
                            })
                        )
                            per[e.clientId || "—"] =
                                (per[e.clientId || "—"] || 0) + e.minutes;
                    });
                    if (S.timer)
                        per[S.timer.clientId] =
                            (per[S.timer.clientId] || 0) +
                            days.reduce(function (a, x) {
                                return a + runningOn(x.k);
                            }, 0);
                    const cl = Object.keys(per).sort(function (a, b) {
                            return per[b] - per[a];
                        }),
                        cmax = cl.length ? per[cl[0]] : 1;
                    $("#weekTotal").textContent = fmtMin(total) + " tracked";
                    $("#week").innerHTML =
                        '<div class="days">' +
                        days
                            .map(function (x) {
                                return (
                                    '<button class="' +
                                    (x.m ? "" : "z ") +
                                    (x.k === viewDay ? "sel" : "") +
                                    '" data-a="day" data-d="' +
                                    x.k +
                                    '" aria-label="' +
                                    dayFull(x.k) +
                                    '"><i style="height:' +
                                    Math.max(4, Math.round((x.m / max) * 70)) +
                                    'px"></i><b>' +
                                    x.l +
                                    "</b></button>"
                                );
                            })
                            .join("") +
                        "</div>" +
                        '<div class="h3">By client</div>' +
                        (cl.length
                            ? cl
                                  .map(function (c) {
                                      return (
                                          '<div class="cr"><div class="row"><span>' +
                                          esc(c) +
                                          "</span><span>" +
                                          fmtMin(per[c]) +
                                          '</span></div><div class="bar"><i style="width:' +
                                          Math.max(3, Math.round((per[c] / cmax) * 100)) +
                                          "%;background:" +
                                          tint(c) +
                                          '"></i></div></div>'
                                      );
                                  })
                                  .join("")
                            : '<div class="empty">Nothing tracked this week.</div>');
                }
                function renderMini() {
                    const el = $("#mini");
                    if (S.timer && tab !== "today") {
                        el.innerHTML =
                            '<div class="mini"><div class="mx"><div class="mc">' +
                            esc(S.timer.clientId) +
                            (S.timer.desc ? " · " + esc(S.timer.desc) : "") +
                            '</div><div class="mt" id="miniTime">' +
                            hms((Date.now() - S.timer.start) / 1000) +
                            '</div></div><button class="pill stop" data-a="stop">' +
                            I.stop +
                            "Stop</button></div>";
                        el.hidden = false;
                    } else {
                        el.innerHTML = "";
                        el.hidden = true;
                    }
                }
                function render() {
                    renderHeader();
                    renderTimer();
                    renderNow();
                    renderWork();
                    renderMini();
                    if (tab === "plan") renderPlan();
                    if (tab === "time") renderTime();
                    syncReminders();
                    syncTimerNotif();
                }
                function syncReminders() {
                    if (!window.Android || !Android.setReminders) return;
                    const ids = CONFIG.REMIND || [];
                    const list = blocks()
                        .filter(function (b) {
                            return !ids.length || ids.indexOf(b.id) >= 0;
                        })
                        .map(function (b) {
                            return { m: b.s, t: b.title, x: clock(b.s) + "–" + clock(b.e) };
                        });
                    const j = JSON.stringify(list);
                    if (j !== S.rem) {
                        try {
                            Android.setReminders(j);
                            S.rem = j;
                            save();
                        } catch (e) {}
                    }
                }

                /* ---------- live tick ---------- */
                let n = 0,
                    lastTick = Date.now();
                setInterval(function () {
                    const gap = Date.now() - lastTick;
                    lastTick = Date.now();
                    const k = dkey(new Date());
                    if (k !== curDay) {
                        if (viewDay === curDay) viewDay = k;
                        curDay = k;
                        render();
                        return;
                    }
                    if (gap > 2500) {
                        render();
                        return;
                    } // woke from sleep / background: rebuild instead of spinning the hands
                    if (S.timer) {
                        const sec = (Date.now() - S.timer.start) / 1000,
                            t1 = hms(sec);
                        $set("#dTime", t1);
                        $set("#miniTime", t1);
                        const mn = $("#dMin"),
                            sc = $("#dSec"),
                            arc = $("#dArc");
                        if (sc)
                            sc.style.transform =
                                "rotate(" + ((sec + 1) * 6).toFixed(2) + "deg)";
                        if (mn)
                            mn.style.transform =
                                "rotate(" + (((sec + 1) / 3600) * 360).toFixed(2) + "deg)";
                        if (arc)
                            arc.setAttribute(
                                "stroke-dashoffset",
                                (2 * Math.PI * 84 * (1 - (sec % 3600) / 3600)).toFixed(2),
                            );
                        if (n % 5 === 0) {
                            const today = dkey(new Date());
                            $set(
                                "#todayTotal",
                                fmtMin(minutesOn(today) + runningOn(today)),
                            );
                            const m = document.querySelector(
                                '[data-meta="' + S.timer.taskId + '"]',
                            );
                            const t = taskById(S.timer.taskId);
                            if (m && t) {
                                const late = m.querySelector(".late");
                                m.innerHTML =
                                    metaText(t, today) +
                                    (late ? ' · <span class="late">overdue</span>' : "");
                            }
                            if (tab === "time" && !sheetOpen) {
                                const lv = runningOn(viewDay);
                                if (lv > 0) {
                                    $set("#liveDur", fmtMin(lv));
                                    $set("#dayBig", fmtMin(minutesOn(viewDay) + lv));
                                }
                            }
                        }
                    }
                    if (++n % 30 === 0 && !sheetOpen) {
                        renderNow();
                        if (tab === "plan") renderPlan();
                    }
                }, 1000);
                document.addEventListener("visibilitychange", function () {
                    if (!document.hidden) {
                        render();
                        syncNow();
                        checkNativeStop();
                    }
                });
                window.addEventListener("online", syncNow);

                /* ---------- boot ---------- */
                render();
                syncNow();
                checkNativeStop();
                setTimeout(function () {
                    const sp = $("#splash");
                    if (!sp) return;
                    sp.classList.add("out");
                    setTimeout(function () {
                        sp.remove();
                    }, 400);
                }, 750);
                window.__dini = {
                    S: function () {
                        return S;
                    },
                    render: render,
                }; // handy for debugging
            })();
        </script>
    </body>
</html>
